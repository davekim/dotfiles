set -g default-shell /bin/zsh

# split windows like vim
# vim's definitions of a horizontal/vertical split is revsered from tmux's
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind ^s split-window -v -c "#{pane_current_path}"
bind ^v split-window -h -c "#{pane_current_path}"

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind ^h select-pane -L
bind ^j select-pane -D
bind ^k select-pane -U
bind ^l select-pane -R

# resize panes like vim
bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 10
bind + resize-pane -U 10

# bind : to command-prompt like vim
# this is the default in tmux already
bind : command-prompt

# session management
bind C new-session
bind L choose-session

# vi-style controls for copy mode
setw -g mode-keys vi

# remap prefix to ^A
unbind C-b
set -g prefix ^A
bind a send-prefix

bind ^a last-window # toggle last window like screen

set-option -g status-style bg=default
set -g status-fg white

bind K confirm kill-server
bind X confirm kill-window

# left side of status bar holds nothing at the moment
set -g status-left-length 100
set -g status-left-style bg=green,fg=black,bold
set -g status-left ''

# right side of status bar holds "[host name] (date time)"
set -g status-right-length 100
set -g status-right '#[fg=colour214,bg=colour235] #H#[fg-colour238]:#[fg=colour178]#S #[fg=colour039,bg=colour238] %y.%m.%d %H:%M '

# make background window look like white tab
set-window-option -g window-style bg=default,fg=white
set-window-option -g window-status-format '#[fg=colour214,bg=colour235] #I #[fg=white,bg=colour236] #W#[fg=colour5,bg=colour236]#F #[default]'

# make foreground window look like bold yellow foreground tab
set-window-option -g window-status-current-format '#[fg=black,bg=colour214] #I #[fg=brightwhite,bg=colour238] #W#[fg=colour39,bg=colour238]#F #[default]'

# set active terminal yellow border, non-active white
set -g pane-border-style bg=default,fg=colour238
set -g pane-active-border-style bg=default,fg=colour214

# set a 256color $TERM variable so programs inside tmux know they can use 256 color
set -g default-terminal screen-256color

# Rebind prefix to b
bind B set -g prefix ^b
bind A set -g prefix ^a

# Toggle mouse on with m
bind m \
  set -g mouse on \;\
  display 'Mouse: ON'

# Toggle mouse off with M
bind M \
  set -g mouse off \;\
  display 'Mouse: OFF'

# reload tmux config file with C-a r
bind r source ~/.tmux.conf

# Create a new window
bind N command-prompt "new-window -n '%%' -c '#{pane_current_path}'"
bind c new-window -c '#{pane_current_path}'
